<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Support | NEXTBASE JAPAN</title>
  <style>
    :root{--bg:#050505;--panel:#0e0e0e;--line:#232323;--gold:#d6b25e;--text:#e8e8e8;--muted:#bdbdbd;}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",Arial;line-height:1.8}
    a{color:var(--gold);text-decoration:none} a:hover{opacity:.85}
    .wrap{max-width:920px;margin:0 auto;padding:26px 18px 60px}
    .top{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
    .brand{color:var(--gold);font-weight:800;letter-spacing:.18em}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
    h1{color:var(--gold);margin:0 0 10px 0}
    .muted{color:var(--muted);font-size:12px}
    .nav{margin-top:14px;font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">NEXTBASE JAPAN</div>
      <div class="muted">Support</div>
      <div class="nav"><a href="/">← Back to Home</a></div>
    </div>

    <div class="card">
      <h1>Support</h1>
      <p>お問い合わせはメールで受け付けます。</p>
      <p><b>Email:</b> <a href="mailto:info@nextbase-japan.com">info@nextbase-japan.com</a></p>
      <p class="muted"><b>Response Time:</b> Within 3–5 business days.</p>
      <p class="muted"><b>Scope:</b> Installation and core functionality.</p>
    </div>
  </div>
</body>
</html>
