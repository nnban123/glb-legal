<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXTBASE - Legal Documents</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { background-color: #000; color: #d4af37; font-family: 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: 0 auto; }
        h1, h2, h3 { color: #f9e2af; border-bottom: 1px solid #d4af37; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #d4af37; padding: 12px; text-align: left; }
        th { background-color: #1a1a1a; }
        a { color: #f9e2af; text-decoration: underline; }
        .footer { margin-top: 50px; font-size: 0.8em; text-align: center; color: #888; }
    </style>
</head>
<body>
    <div id="content">読み込み中...</div>
    <div class="footer">&copy; 2024 NEXTBASE</div>

    <script>
        // URLの末尾（?page=legal_notice など）から読み込むファイルを判断
        const params = new URLSearchParams(window.location.search);
        const page = params.get('page') || 'legal_notice';
        
        fetch(`${page}.md`)
            .then(response => response.text())
            .then(text => {
                document.getElementById('content').innerHTML = marked.parse(text);
            })
            .catch(err => {
                document.getElementById('content').innerHTML = "ドキュメントが見つかりません。";
            });
    </script>
</body>
</html>
