<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXTBASE ONE - Legal</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 黒金の高級感を出すためのデザイン設定 */
        body { 
            background-color: #000000; 
            color: #E5C100; /* 深みのあるゴールド */
            font-family: "Times New Roman", "游明朝", serif;
            line-height: 1.8;
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        #content {
            background-color: #0a0a0a;
            padding: 40px;
            border: 1px solid #D4AF37; /* 金の縁取り */
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }
        h1, h2 { 
            color: #FFD700; 
            border-bottom: 2px solid #D4AF37;
            padding-bottom: 15px;
            text-align: center;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin: 30px 0; 
            border: 1px solid #D4AF37;
        }
        th, td { 
            border: 1px solid #D4AF37; 
            padding: 15px; 
            text-align: left;
        }
        th { background-color: #1a1a1a; color: #FFD700; }
        /* 戻るボタンのデザイン */
        .nav-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #000;
            background-color: #D4AF37;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 3px;
        }
        .nav-btn:hover { background-color: #FFD700; }
    </style>
</head>
<body>
    <div id="content">
        <div id="md-view">読み込み中...</div>
    </div>

    <script>
        // URLの末尾（?p=...）を見て、表示する内容を切り替える
        const params = new URLSearchParams(window.location.search);
        const page = params.get('p') || 'legal_notice';
        
        fetch(`${page}.md`)
            .then(res => {
                if(!res.ok) throw new Error();
                return res.text();
            })
            .then(text => {
                document.getElementById('md-view').innerHTML = marked.parse(text);
            })
            .catch(() => {
                document.getElementById('md-view').innerHTML = "<h1>ページが見つかりません</h1>";
            });
    </script>
</body>
</html>
